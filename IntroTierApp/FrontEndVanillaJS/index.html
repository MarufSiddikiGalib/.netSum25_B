<html>
    <head>
        <script>
            function loadDoc() {
            
            var xhttp = new XMLHttpRequest();
            xhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    var response = this.responseText;
                    var data = JSON.parse(response);
                    var tBody="";
                    for(i=0;i<data.length;i++){
                        var obj = data[i];
                        var tr = "<tr><td>"+obj.Id + "</td><td>"+
                                    obj.Name+ "</td><td>"+
                                    obj.Address + "</td></tr>";
                        tBody += tr;  
                    }
                    document.getElementById("tBody").innerHTML = tBody;
                }
            };
            xhttp.open("GET", "https://localhost:44340/api/student/all", true);
            xhttp.send();
}
        </script>
    </head>
    <body>
        <button onclick="loadDoc()">Load Data</button>
        <table border="1">
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Name</th>
                    <th>Address</th>
                </tr>
            </thead>
            <tbody id="tBody">
                
            </tbody>
            

        </table>
    </body>
</html>
